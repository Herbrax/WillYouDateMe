<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150E20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E">
<title>Hey Little Fairy</title>
<meta name="description" content="A heart-shaped note with a question on it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="halo" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<audio id="music" loop preload="auto"></audio>

<button id="soundToggle" class="sound" type="button" aria-pressed="true" title="Sound on">
  <span aria-hidden="true">♪</span>
  <span class="sr-only">Toggle sound</span>
</button>

<main class="stage">

  <!-- ─────────── scene: the question ─────────── -->
  <section class="scene scene--ask is-active" id="sceneAsk" aria-label="The question">
    <div class="note" id="note">
      <div class="note__paper">
        <svg class="note__stitch" viewBox="0 0 32 29.6" aria-hidden="true" focusable="false">
          <path d="M23.6,0 C20.2,0 17.3,2.7 16,5.6 C14.7,2.7 11.8,0 8.4,0
                   C3.8,0 0,3.8 0,8.4 C0,17.8 9.5,20.3 16,29.6
                   C22.1,20.3 32,17.5 32,8.4 C32,3.8 28.2,0 23.6,0 Z"
                transform="translate(16 14.8) scale(.88) translate(-16 -14.8)"/>
        </svg>
        <p class="note__text" id="noteText"></p>
        <span class="note__sign" id="noteSign"></span>
      </div>
    </div>

    <div class="choice">
      <button class="btn btn--yes" id="yesBtn" type="button">Yes</button>
      <span class="choice__slot" id="noSlot">
        <button class="btn btn--no" id="noBtn" type="button">No</button>
      </span>
    </div>

    <p class="hint" id="hint" role="status" aria-live="polite"></p>
  </section>

  <!-- ─────────── scene: the plan ─────────── -->
  <section class="scene scene--plan" id="scenePlan" aria-label="Plan the date" hidden>
    <div class="note note--mini" aria-hidden="true">
      <div class="note__paper">
        <p class="note__text note__text--mini"><span>yes!</span></p>
      </div>
    </div>

    <form class="card" id="planForm" novalidate>
      <header class="card__head">
        <h1 class="card__title" id="planTitle"></h1>
        <p class="card__sub" id="planSub"></p>
      </header>

      <div class="field">
        <label class="field__label" for="nickname"><i>1</i> <span id="lblNick"></span></label>
        <input type="text" id="nickname" class="input" maxlength="40"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>

      <div class="field">
        <label class="field__label" for="message"><i>2</i> <span id="lblMessage"></span></label>
        <textarea id="message" class="input" rows="3" maxlength="280"></textarea>
        <span class="field__count"><span id="count">0</span>/280</span>
      </div>

      <div class="field field--bleed">
        <span class="field__label"><i>3</i> <span id="lblDay"></span></span>
        <div class="days" id="days" role="radiogroup"></div>
      </div>

      <div class="field">
        <span class="field__label"><i>4</i> <span id="lblTime"></span></span>
        <div class="times" id="times" role="radiogroup"></div>
        <div class="secret">
          <button class="secret__latch" id="secretLatch" type="button" aria-expanded="false" aria-controls="secretChip">
            <span aria-hidden="true" id="secretGlyph"></span>
            <span class="sr-only" id="lblSecretLatch"></span>
          </button>
          <button class="secret__chip" id="secretChip" type="button" role="switch" aria-checked="false" hidden>
            <b id="lblSecret"></b><span id="lblSecretSub"></span>
          </button>
        </div>
        <label class="custom" id="customWrap" hidden>
          <span id="lblCustom"></span>
          <input type="time" id="customTime" class="input input--time" value="19:00">
        </label>
      </div>

      <footer class="card__foot">
        <p class="summary" id="summary"></p>
        <button class="btn btn--confirm" id="confirmBtn" type="submit" disabled></button>
      </footer>
    </form>
  </section>

  <!-- ─────────── scene: it's a date ─────────── -->
  <section class="scene scene--done" id="sceneDone" aria-label="Confirmed" hidden>
    <div class="note note--done">
      <div class="note__paper">
        <svg class="note__stitch" viewBox="0 0 32 29.6" aria-hidden="true" focusable="false">
          <path d="M23.6,0 C20.2,0 17.3,2.7 16,5.6 C14.7,2.7 11.8,0 8.4,0
                   C3.8,0 0,3.8 0,8.4 C0,17.8 9.5,20.3 16,29.6
                   C22.1,20.3 32,17.5 32,8.4 C32,3.8 28.2,0 23.6,0 Z"
                transform="translate(16 14.8) scale(.88) translate(-16 -14.8)"/>
        </svg>
        <p class="note__text note__text--done" id="doneHeart"></p>
      </div>
    </div>

    <div class="receipt">
      <h1 class="receipt__title" id="doneTitle"></h1>
      <dl class="receipt__rows">
        <div class="receipt__row"><dt id="lblWhen"></dt><dd id="rWhen">—</dd></div>
        <div class="receipt__row"><dt id="lblWhat"></dt><dd id="rWhat">—</dd></div>
        <div class="receipt__row receipt__row--note" id="rNoteRow" hidden>
          <dt id="lblNote"></dt><dd id="rNote">—</dd>
        </div>
        <div class="receipt__row" id="rCodeRow" hidden>
          <dt id="lblCode"></dt>
          <dd><b id="rCode">—</b> <em class="muted" id="lblCodeHint"></em></dd>
        </div>
      </dl>
      <p class="receipt__status" id="mailStatus" role="status" aria-live="polite"></p>
      <a class="btn btn--cal" id="calBtn" download></a>
      <button class="linkbtn" id="againBtn" type="button"></button>
    </div>
  </section>

</main>

<p class="credit">By Tatiana <span>(Muse)</span> &amp; Simo <span>(Dev)</span></p>

<div class="shoo" id="shoo" hidden>
  <div class="shoo__box" role="alertdialog" aria-modal="true" aria-labelledby="shooTitle" aria-describedby="shooBody">
    <p class="shoo__broom" aria-hidden="true">🧹</p>
    <h2 class="shoo__title" id="shooTitle"></h2>
    <p class="shoo__body" id="shooBody"></p>
    <button class="btn btn--shoo" id="shooBtn" type="button"></button>
  </div>
</div>

<svg class="defs" aria-hidden="true" focusable="false">
  <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
    <path d="M.7375,0 C.6313,0 .5406,.0912 .5,.1892 C.4594,.0912 .3688,0 .2625,0
             C.1188,0 0,.1284 0,.2838 C0,.6014 .2969,.6858 .5,1
             C.6906,.6858 1,.5912 1,.2838 C1,.1284 .8813,0 .7375,0 Z"/>
  </clipPath>
</svg>

<script src="app.js"></script>
</body>
</html>
